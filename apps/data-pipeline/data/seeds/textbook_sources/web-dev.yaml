source_id: web-dev
name: web.dev (Google)
kind: supplementary
homepage: https://web.dev/
format: html
# Plain HTTP GET returns the full article as static HTML (checked 2026-11-17, UA ai-recruit-data-pipeline/0.1).
# article.devsite-article holds h1 + author byline + article body (div.devsite-article-body) + rating widget; the
# sidebar, TOC and footer are outside it. Do NOT use div.devsite-article-body: it excludes the h1 and the parser then
# nests every h2 under the first h2.
# KNOWN PARSER ISSUE: the h1 contains a hidden <devsite-actions hidden> tooltip ("Stay organized with collections /
# Save and categorize content based on your preferences."), so parse_html_page returns that text appended to the page
# title and every chunk's first line carries it. Fix on the parser side: decompose elements with the `hidden`
# attribute (or devsite-actions) before reading the h1. The intro section also starts with the author byline
# ("Philip Walton X GitHub ... Published: ..."); rows below use `sections` so intros are dropped unless a page is
# listed whole (learn/forms/validation, whose intro is one short summary).
content_selector: "article.devsite-article"
language: en
license: CC-BY-4.0
license_class: open
license_url: https://web.dev/articles/lcp
# Footer of every article, word for word (read on /articles/lcp 2026-11-17); the linked "Google Developers Site
# Policies" page (https://developers.google.com/terms/site-policies) repeats the same notice and adds: images, audio,
# video and links to content on other pages "is not covered by the license, unless specifically noted". We copy text
# only. Code samples are Apache-2.0 but code blocks are mostly dropped by the noise filter anyway.
license_quote: "Except as otherwise noted, the content of this page is licensed under the Creative Commons Attribution 4.0 License, and code samples are licensed under the Apache 2.0 License."
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://web.dev/robots.txt (HTTP 200) has one group, 'User-agent: *', with 'Disallow: /*?*authuser=' (query strings containing authuser) and a Sitemap line. No Crawl-delay. /articles/* and /learn/* are not disallowed; fetch URLs without query strings."
attribution: "web.dev, Google LLC and individual authors, https://web.dev, content licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/), code samples under Apache 2.0. Notice: notices/web-dev.txt"
status: use
