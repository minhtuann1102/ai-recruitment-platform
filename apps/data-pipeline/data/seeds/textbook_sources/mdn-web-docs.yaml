source_id: mdn-web-docs
name: MDN Web Docs
kind: supplementary
homepage: https://developer.mozilla.org/en-US/docs/
format: html
# Plain HTTP GET returns pre-rendered static HTML (checked 2026-11-17, UA ai-recruit-data-pipeline/0.1).
# main#content holds h1 + baseline banner + article sections + "Help improve MDN" footer line; the left sidebar and
# site footer are outside it. The right-hand TOC (aside > nav) sits inside main but nav tags are stripped by the parser.
# Do NOT use article.main-page-content (no such element) or .layout__body (excludes the h1, so the parser nests every
# h2 under the first h2). Intro text (before the first h2, usually the page's best summary) starts with a baseline
# banner ("This feature is well established and works across many devices ... See full compatibility Learn more"):
# reviewers should trim it. Pages listed whole also end with "Help improve MDN / This page was last modified on ...",
# which the noise filter drops as too_short.
content_selector: "main#content"
language: en
license: CC-BY-SA-2.5
license_class: open
license_url: https://developer.mozilla.org/en-US/docs/MDN/Writing_guidelines/Attrib_copyright_license
# Page "Attribution and copyright licensing", section "Documentation" (read 2026-11-17). Page footer of every MDN
# page says "Portions of this content are ©1998-2026 by individual mozilla.org contributors. Content available under
# a Creative Commons license." Code samples added on or after 2010-08-20 are CC0; we keep text and short code only.
license_quote: "Unless otherwise indicated, the content is available under the terms of the Creative Commons Attribution-ShareAlike license (CC-BY-SA), v2.5 or any later version."
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://developer.mozilla.org/robots.txt (HTTP 200) has one group, 'User-agent: *', with Disallow: /api/, /*/files/ and /media, plus a Sitemap line. No Crawl-delay. /en-US/docs/... is not disallowed; do not fetch /api/ or /*/files/ links."
attribution: "MDN Web Docs, Mozilla Contributors, https://developer.mozilla.org, licensed under CC-BY-SA 2.5 or any later version (https://creativecommons.org/licenses/by-sa/2.5/). Notice: notices/mdn-web-docs.txt"
status: use
