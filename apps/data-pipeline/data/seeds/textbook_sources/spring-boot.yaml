source_id: spring-boot
name: Spring Boot Reference Documentation
kind: official
homepage: https://docs.spring.io/spring-boot/reference/index.html
format: html
# Overview page https://docs.spring.io/spring-boot/ is the landing page; the reference index is reference/index.html.
# Typical page (features/external-config.html): one article.doc holds the text. Inside it strip
# div.breadcrumbs-container (nav.breadcrumbs, top; includes empty li#copy-url), nav.pagination (Prev/Next
# links, bottom) and a.anchor (empty permalink anchors in headings). Sidebar (aside.sidebar), toolbar, footer
# and version modal are outside article.doc.
content_selector: "article.doc"
language: en
# No statement names the documentation: no copy notice on reference/index.html, documentation.html or
# features/external-config.html; the site footer is the only copyright line (quoted below; the year is
# written by JavaScript, a browser shows 'Copyright © 2005 - 2026 Broadcom.'). Project statement (names the
# software, not the docs): README.adoc, section License, https://github.com/spring-projects/spring-boot:
# 'Spring Boot is Open Source software released under the Apache 2.0 license.' Root LICENSE.txt is Apache-2.0;
# the docs sources live in the same repo (documentation/spring-boot-docs) with no separate license file.
# Footer 'Terms of Use' link (https://www.vmware.com/help/legal.html, redirects to https://www.broadcom.com/company/legal/terms-of-use) returned only a page title to a plain request (content is loaded by JavaScript), so any terms on automated collection are UNCONFIRMED.
