source_id: react-dev
name: React Documentation (react.dev)
kind: official
homepage: https://react.dev/learn
format: html
# Plain HTTP GET returns the full article as server-rendered HTML (checked 2026-11-17, UA ai-recruit-data-pipeline/0.1):
# no JS rendering needed. <article> holds h1 + body and excludes sidebar and footer. Inside it, Sandpack examples
# come out as <pre> code and each page ends with "Recap" and "Try out some challenges" (use `sections` to skip them).
# "You will learn" box is a one-line list of bullets, also skipped by `sections`.
content_selector: "article"
language: en
license: CC-BY-4.0
license_class: open
license_url: https://raw.githubusercontent.com/reactjs/react.dev/main/README.md
# README.md "## License" (rendered on GitHub without the markdown link brackets). The raw text is:
#   Content submitted to [react.dev](https://react.dev/) is CC-BY-4.0 licensed, as found in the [LICENSE-DOCS.md](https://github.com/reactjs/react.dev/blob/main/LICENSE-DOCS.md) file.
# LICENSE-DOCS.md (same repo) is the full "Attribution 4.0 International" legal text. Site footer on every page:
# "Copyright © Meta Platforms, Inc". Already checked for spec 005 on 2026-10-19; re-opened 2026-11-17.
license_quote: "Content submitted to react.dev is CC-BY-4.0 licensed, as found in the LICENSE-DOCS.md file."
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://react.dev/robots.txt (HTTP 200) has one group, 'User-agent: *' with an empty 'Disallow:' line (nothing disallowed). No Crawl-delay, no Sitemap line. /learn/* is allowed."
attribution: "React Documentation, Copyright © Meta Platforms, Inc, https://react.dev, licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Notice: notices/react-dev.txt"
status: use
