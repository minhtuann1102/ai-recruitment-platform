source_id: fastapi
name: FastAPI Documentation
kind: official
homepage: https://fastapi.tiangolo.com/
format: html
# Page body lives in article.md-content__inner (sidebar, header and footer are outside it). Every page body opens with
# the same banner ("Use the official FastAPI skill for your installed version. Install it from your project
# directory: uvx library-skills / See Develop with AI."), which lands in the intro chunk: trim it in review. Headings
# end with a permalink sign, so `sections` values below carry a trailing " ¶" exactly as the parser sees them.
content_selector: "article.md-content__inner"
language: en
license: MIT
