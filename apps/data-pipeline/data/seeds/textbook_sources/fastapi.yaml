license_quote: "This project is licensed under the terms of the MIT license."
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://fastapi.tiangolo.com/robots.txt (HTTP 200) has no User-agent group and no Disallow, Allow or Content-Signal line: the file is only a comment block about Cloudflare content signals, which says that a signal the operator does not include neither grants nor restricts permission. Docs paths are not restricted. Plain requests to /tutorial/ and /advanced/ pages return 200 with full HTML (no challenge page)."
attribution: "FastAPI documentation, Copyright (c) 2018 Sebastián Ramírez, MIT License (the LICENSE file covers the software and associated documentation files). Notice: notices/fastapi.txt"
