source_id: nestjs
name: NestJS Documentation
kind: official
homepage: https://docs.nestjs.com/
format: html
# The site is an Angular app but pages are prerendered: a plain GET returns the full chapter, so no --render is needed.
# Chapter text is inside main#content > app-<name> > div.content-inner (h3 = chapter title, h4 = subsections). Outside
# .content-inner: sidebar, "Copy markdown" button, previous/next navigation, "Support us" block, newsletter, footer.
# Parser notes (no change made here): the page has no <h1>, so the title falls back to <title>
# ("<chapter> | NestJS - A progressive Node.js framework"); crawlers/docs_section_parser splits on h1-h3 only, so each
# chapter becomes ONE section and the h4 subsection headings are not kept in the text. Hence `sections` is empty on
# every page. The same chapters exist as markdown in the docs repo (content/<group>/<name>.md) but with @@filename /
# @@switch tab directives, so html is used.
content_selector: ".content-inner"
language: en
license: MIT
license_class: open
# LICENSE of the docs repository (nestjs/docs.nestjs.com, branch master), read as raw text; the quote is its permission
# sentence word for word (line breaks joined). README.md of the repo says "Nest is MIT licensed" and the docs site says
# "Nest is an MIT-licensed open source project." and "Copyright © 2017-2026 MIT by Kamil Mysliwiec" in its footer.
license_url: https://github.com/nestjs/docs.nestjs.com/blob/master/LICENSE
license_quote: "Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the 'Software'), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:"
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://docs.nestjs.com/robots.txt (HTTP 200) has one group, User-agent: *, with Allow: / and Disallow: /v4 through /v11 (archived major versions). No Crawl-delay; Sitemap: https://docs.nestjs.com/sitemap.xml. Current chapters (no version prefix) are allowed; never fetch /v4../v11 paths. The site also publishes llms.txt and a .md copy per chapter; not used here."
attribution: "NestJS Documentation, Copyright (c) 2017-present Kamil Myśliwiec, MIT License. Notice: notices/nestjs.txt"
status: use
excluded_reason: ""
