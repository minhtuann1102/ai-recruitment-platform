name: The System Design Primer
kind: supplementary
homepage: https://github.com/donnemartin/system-design-primer
format: markdown
# Content is markdown in the repo (default branch: master). Raw endpoint pattern:
# https://raw.githubusercontent.com/donnemartin/system-design-primer/master/<path>
# English content files: README.md (root, one long file) and solutions/system_design/<name>/README.md
# (mint, pastebin, query_cache, sales_rank, scaling_aws, social_graph, twitter, web_crawler).
# solutions/object_oriented_design/ has no markdown (only .py / .ipynb). README-ja.md, README-zh-Hans.md and
# README-zh-TW.md are translations, out of scope for language: en.
content_selector: ""
language: en
license: CC-BY-4.0
license_class: open
license_url: https://raw.githubusercontent.com/donnemartin/system-design-primer/master/LICENSE.txt
# Scope sentence in LICENSE.txt and README.md "## License" (README.md raw line 1833, shown there in italics; in
# LICENSE.txt it wraps over three lines), word for word:
#   I am providing code and resources in this repository to you under an open source license.  Because this is my personal repository, the license you receive to my code and resources is from me and not my employer (Facebook).
# The notice then reads "Copyright 2017 Donne Martin", then the CC BY 4.0 line quoted below, then the URL
# http://creativecommons.org/licenses/by/4.0/ . The statement says "code and resources" together; it does not
# separate code from prose. GitHub's license detector shows this repo as "Other / NOASSERTION" (non-standard file).
# README.md captions 27 images with "Source: <third party>" and says "Credits and sources are provided throughout
# this repo." (## Credits). We copy text only.
license_quote: "Creative Commons Attribution 4.0 International License (CC BY 4.0)"
license_checked: 2026-11-14
robots_checked: 2026-11-14
