format: html
# Guides live under https://nodejs.org/learn/<section>/<page> (no /en/ prefix; list: https://nodejs.org/learn/sitemap.xml).
# Static server-rendered HTML. The whole article is inside <main> (h1 title, then h2 sections); sidebar, site header and
# footer are outside <main>. Code samples sit in <is-land> custom elements whose <pre> text is kept (CJS/ESM tab labels
# appear as a leading "CJS ESM" in code chunks). Do not use the /docs/ or /dist/ paths (robots disallow).
content_selector: "main"
language: en
license: CC-BY-4.0
license_class: open
# The nodejs.org footer links "Terms of Use" to this address, which serves a PDF (5 pages); the sentence below is the
