# the website source code; the OpenJS statement is the one that names Content.
license_url: https://terms-of-use.openjsf.org/
license_quote: "Except as otherwise provided, Content on this site, including all materials posted by the OpenJS Foundation, is licensed under a Creative Commons Attribution 4.0 License."
license_checked: 2026-11-17
robots_checked: 2026-11-17
robots_note: "https://nodejs.org/robots.txt (HTTP 200) has one group, User-agent: *, with Allow: /dist/latest/, /dist/latest/docs/api/, /api/ and Disallow: /dist/, /docs/. No Crawl-delay; Sitemap: https://nodejs.org/sitemap.xml and https://nodejs.org/learn/sitemap.xml. /learn/ is not disallowed (allowed by default); never fetch /docs/ or /dist/. The OpenJS Terms of Use PDF has no clause about robots, scraping, crawling or automated access (searched for those words)."
attribution: "Node.js Learn guides, Copyright OpenJS Foundation and Node.js contributors. All rights reserved. Content licensed under Creative Commons Attribution 4.0 International (https://creativecommons.org/licenses/by/4.0/); passages are excerpts cut by section, text otherwise unchanged. Notice: notices/nodejs.txt"
