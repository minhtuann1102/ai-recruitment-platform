# Next.js page: article body is main#main-content (sidebar and top navigation are outside it); a few "related"
# card titles at the end become short sections that the noise filter drops. Pages are 380-770 KB of HTML: with the
# crawler settings (httpx, timeout 30, crawler User-Agent) the 5 pages below were fetched in 0.4-1.6 s on 2026-11-17, in
# two runs; one earlier curl with a browser User-Agent took 90 s for 773 KB and was not reproduced (httpx timeout is
# per phase, so a slow but steady stream would still finish).
# https://docs.livekit.io/llms.txt says "Append .md to any page URL for clean Markdown" but format markdown only
# accepts GitHub URLs, so HTML is used.
