# Page body lives in article.bd-article (pydata-sphinx-theme); the left sidebar, "previous/next" footer and site footer
# are outside it. Headings keep the permalink anchor text: every heading ends with " #" (a.headerlink) and the page
# title too, e.g. "3.4.4.9. Precision, recall and F-measures #". The `sections` matcher strips the leading number but
# not the " #", so each `sections` entry below is listed twice, with and without " #" (harmless if the parser later
# drops the anchor text). Matching is at any level of the heading path: naming an h2 pulls in all its h3 children.
