  etcd:
    extends:
      file: .docker/compose/apisix/apisix.yml
      service: etcd
    container_name: ai_recruit_apisix_etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    command:
      - /usr/local/bin/etcd
      - --name
      - etcd
      - --data-dir
      - /etcd-data
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://etcd:2379
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --initial-advertise-peer-urls
      - http://etcd:2380
      - --initial-cluster
      - etcd=http://etcd:2380
      - --initial-cluster-token
      - etcd-cluster
      - --initial-cluster-state
      - new
    networks:
      - ai-recruit-network
    volumes:
      - ./.docker/volumes/etcd-data:/etcd-data
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 5s
      timeout: 5s
      retries: 10

  apisix:
    extends:
      file: .docker/compose/apisix/apisix.yml
      service: apisix
    container_name: ai_recruit_apisix
    environment:
      APISIX_PROFILE: ${APISIX_PROFILE}
    volumes:
      - ./config/apisix/conf/config-${APISIX_PROFILE}.yaml:/usr/local/apisix/conf/config-${APISIX_PROFILE}.yaml
      - ./config/apisix/conf/debug-${APISIX_PROFILE}.yaml:/usr/local/apisix/conf/debug-${APISIX_PROFILE}.yaml
    ports:
      - "${APISIX_NODE_LISTEN}:${APISIX_NODE_LISTEN}"
      # Admin API stays on localhost: APISIX_KEY is a local-only sample value
      - "127.0.0.1:${APISIX_DEPLOYMENT_ADMIN_LISTEN}:${APISIX_DEPLOYMENT_ADMIN_LISTEN}"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "</dev/tcp/127.0.0.1/$${APISIX_NODE_LISTEN}"']
      interval: 5s
      timeout: 3s
      retries: 20
    env_file:
      - .env
    networks:
      - ai-recruit-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  apisix-homepage:
    image: nginx:1.29-alpine
    volumes:
      - ./config/apisix/homepage/index-dev.html:/usr/share/nginx/html/index.html
    ports:
      - "${APISIX_HOMEPAGE_PORT}:80"

  adc:
    build:
      context: .
      dockerfile: ./.docker/compose/apisix/Dockerfile.adc
    container_name: ai_recruit_adc
    restart: 'no'
    networks:
      - ai-recruit-network
    depends_on:
      apisix:
        condition: service_started
    environment:
      ADC_BACKEND: apisix
      ADC_SERVER: http://apisix:${APISIX_DEPLOYMENT_ADMIN_LISTEN}
      ADC_TOKEN: ${APISIX_KEY}
    env_file:
      - .env
    volumes:
      - ./config/apisix:/work

volumes:
  redisinsight_data:
  kafka_data:
  user_pgdata:
  redis_data:
  etcd-data:

networks:
  ai-recruit-network:
