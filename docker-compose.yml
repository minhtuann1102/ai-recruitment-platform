services:
  db:
    container_name: ai_recruit_db
    extends:
      file: .docker/compose/postgresql/postgresql.yml
      service: postgresql
    ports:
      - '${PG_HOST_PORT:-5534}:5432'
    volumes:
      - ./.docker/volumes/pgdata:/var/lib/postgresql/data
      # Creates user_db, job_db, interview_db, notification_db, ai_db (+ vector); re-run: make db-ensure
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - ai-recruit-network
    environment:
      POSTGRES_USER: ${DEFAULT_PG_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PG_PASSWORD}
      POSTGRES_DB: ${DEFAULT_PG_DATABASE}
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for CV/avatar/logo. Switching to AWS S3 only needs env changes
  # (STORAGE_TYPE=s3, AWS_S3_*), see specs/001-platform-foundation/research.md R6.
  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    container_name: ai_recruit_minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - ./.docker/volumes/minio_data:/data
    networks:
      - ai-recruit-network

  # One-shot: waits for MinIO, then creates the bucket if missing.
  storage-init:
    image: amazon/aws-cli:2.37.9
    container_name: ai_recruit_storage_init
    restart: 'no'
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        n=0
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
          n=$$((n + 1)); [ "$$n" -ge 30 ] && echo 'minio not ready after 60s' && exit 1
          sleep 2
        done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$AWS_S3_BUCKET_NAME" 2>/dev/null           || aws --endpoint-url http://minio:9000 s3 mb "s3://$$AWS_S3_BUCKET_NAME"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    networks:
      - ai-recruit-network

  redis:
    container_name: ai_recruit_redis
    extends:
      file: .docker/compose/redis/redis.yml
      service: redis
    ports:
      - '6374:6379'
    networks:
      - ai-recruit-network
    volumes:
      - ./.docker/volumes/redis_data:/data
    command: redis-server --appendonly yes --dir /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    container_name: ai_recruit_redisinsight
    extends:
      file: .docker/compose/redis/redis.yml
      service: redisinsight
    depends_on:
      - redis
    volumes:
      - ./.docker/volumes/redisinsight_data:/db
    ports:
      - '5544:5540'
    links:
      - redis
    networks:
      - ai-recruit-network

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_recruit_ai_service
    ports:
      - '8000:8000'
    networks:
      - ai-recruit-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

