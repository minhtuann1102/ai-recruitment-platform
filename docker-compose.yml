services:
  db:
    container_name: ai_recruit_db
    extends:
      file: .docker/compose/postgresql/postgresql.yml
      service: postgresql
    ports:
      - '${PG_HOST_PORT:-5534}:5432'
    volumes:
      - ./.docker/volumes/pgdata:/var/lib/postgresql/data
      # Local ai_db (+ pgvector, knowledge_chunks) for data-pipeline dev; re-run: make db-ensure
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - ai-recruit-network
    environment:
      POSTGRES_USER: ${DEFAULT_PG_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PG_PASSWORD}
      POSTGRES_DB: ${DEFAULT_PG_DATABASE}
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_recruit_ai_service
    ports:
      - '8000:8000'
    networks:
      - ai-recruit-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  # Voice (STT / TTS qua Blaze, chi so trinh bay): service noi bo, giu key Blaze phia server (spec 015, ADR-011).
  # Cau hinh o apps/voice-service/.env (chep tu .env.example); thieu file thi van len, /api/health bao `unconfigured`.
  voice-service:
    build:
      context: ./apps/voice-service
      dockerfile: Dockerfile
    container_name: ai_recruit_voice_service
    ports:
      # chi localhost: service khong co route public; cac service khac toi qua mang ai-recruit-network
      - '127.0.0.1:8020:8020'
    env_file:
      - path: ./apps/voice-service/.env
        required: false
    networks:
      - ai-recruit-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8020/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ai-recruit-network:
