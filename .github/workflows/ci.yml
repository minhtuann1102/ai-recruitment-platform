# Gate for every PR and every push to main (GitHub Flow). No secrets: tests must run offline.
# Contract: specs/001-platform-foundation/contracts/ci-pipeline.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version read from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [ai-service, data-pipeline]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        working-directory: .
        run: |
          if [ -f "apps/${{ matrix.app }}/requirements.txt" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps/${{ matrix.app }} has no requirements.txt, skipping"
          fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements*.txt
      - if: steps.guard.outputs.present == 'true'
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt pytest; fi
      - if: steps.guard.outputs.present == 'true'
        run: python -m pytest -q
